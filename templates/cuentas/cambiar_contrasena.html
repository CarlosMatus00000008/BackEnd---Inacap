{% extends "base.html" %}
{% load diario %}

{% block titulo %}Cambiar contraseña{% endblock %}

{% block contenido %}
<div class="centrado">
  <section class="tarjeta panel-cuenta" aria-labelledby="titulo-contrasena">
    <a class="migas" href="{% url 'cuentas:perfil' %}">{% icono "flecha-izq" %} Mi cuenta</a>
    <h1 id="titulo-contrasena">Cambiar contraseña</h1>
    <p>Por seguridad, primero confirma tu contraseña actual.</p>
    <form method="post" class="formulario">
      {% csrf_token %}
      {{ form }}
      <button type="submit" class="boton boton--primario boton--ancho">Cambiar contraseña</button>
    </form>
  </section>
</div>
{% endblock %}
