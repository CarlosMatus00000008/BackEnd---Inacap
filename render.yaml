# Configuración de despliegue en Render (Blueprint).
# Render lee este archivo y crea el servicio con todo listo.
services:
  - type: web
    name: midiariodeviajes
    runtime: python
    region: virginia
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true # Render genera una clave aleatoria
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.tinijhhkogujimpqfykq
      - key: DB_HOST
        value: aws-0-us-east-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_PASSWORD
        sync: false # la contraseña NO va en GitHub: Render la pide al crear
      # Fotos de los viajes → Supabase Storage (Project Settings → Storage → S3 Configuration)
      - key: SUPABASE_S3_ENDPOINT
        value: https://tinijhhkogujimpqfykq.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_BUCKET
        value: fotos-viajes
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false # claves secretas: se ingresan en el panel de Render, no van en GitHub
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
