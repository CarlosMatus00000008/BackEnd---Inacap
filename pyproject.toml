# Configuración de herramientas de calidad de código (opcional).
# Para revisar el código:  pip install ruff  →  ruff check .  y  ruff format .

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "cuentas", "viajes"]
